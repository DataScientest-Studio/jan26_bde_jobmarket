apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: loki
          matcherRegex: "task_id[\"']?:\\s*[\"']?([^\"',}\\s]+)"
          name: task_id
          url: "$${__value.raw}"
