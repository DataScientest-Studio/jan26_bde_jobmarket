server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 100ms
    batchsize: 102400
    timeout: 10s

scrape_configs:
  # Logs structurés JSON de l'API
  - job_name: api_structured
    static_configs:
      - targets:
          - localhost
        labels:
          job: jobmarket-api
          component: api
          log_type: structured
          __path__: /logs/api/structured.jsonl

    pipeline_stages:
      # Parser le JSON
      - json:
          expressions:
            timestamp: timestamp
            event_type: event_type
            level: level
            task_id: task_id
            task_type: task_type
            status: status
            error: error
            model_name: model_name
            version: version
            rome_code: rome_code
            rome_label: rome_label
            rome_index: rome_index
            rome_total: rome_total
            total_global: total_global
            mode: mode
            calls: calls
            records_count: records_count
            records_written: records_written
            duration_sec: duration_sec
            throughput: throughput
            window_days: window_days
            max_rome_codes: max_rome_codes
            jobs_processed: jobs_processed
            companies_processed: companies_processed
            errors: errors

      # Utiliser le timestamp du log si disponible
      - timestamp:
          source: timestamp
          format: RFC3339

      # Ajouter des labels dynamiques
      - labels:
          event_type:
          level:
          task_type:
          status:
          task_id:
          rome_code:

  # Logs texte de l'API (main.log)
  - job_name: api_main
    static_configs:
      - targets:
          - localhost
        labels:
          job: jobmarket-api
          component: api
          log_type: main
          __path__: /logs/api/main.log

  # Logs d'erreurs
  - job_name: api_errors
    static_configs:
      - targets:
          - localhost
        labels:
          job: jobmarket-api
          component: api
          log_type: errors
          level: ERROR
          __path__: /logs/api/errors.log

  # Logs d'ingestion par endpoint
  - job_name: ingestion_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: jobmarket-api
          component: ingestion
          log_type: endpoint
          __path__: /logs/ingestion/*.log

  # Logs de prédiction
  - job_name: prediction_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: jobmarket-api
          component: prediction
          log_type: endpoint
          __path__: /logs/prediction/*.log
