version: "3.9"

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - ./minio-data:/data

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -lc "
      mc alias set jobmarket http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb -p jobmarket/jobmarket || true &&
      echo '✅ Bucket ready: jobmarket'
      "
    restart: "no"

  jupyter:
    build: .
    image: jupyter/scipy-notebook:python-3.11
    container_name: jobmarket-jupyter
    depends_on:
      - minio-init
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: jobmarket

      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: jobmarket
      S3_PREFIX: ""   

      # optionnel : dataset courant
      # DATASET: france_travail

    volumes:
      # Code (repo entier)
      - ./:/home/jovyan/work

      # Mapping explicite notebooks pour éviter de devoir naviguer dans le filesystem du container pour les trouver
      - ./notebooks:/home/jovyan/notebooks

    working_dir: /home/jovyan/work
    command: >
      bash -lc "
      pip install -U pip &&
      if [ -f requirements.txt ]; then pip install -r requirements.txt; fi &&
      start-notebook.sh --NotebookApp.token=$${JUPYTER_TOKEN}
      "
  jobmarket-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: jobmarket-api
    depends_on:
      - minio-init
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override pour MinIO (accès interne Docker)
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs  # Logs accessibles sur l'hôte

  # Stack de monitoring des logs (Grafana + Loki + Promtail)
  loki:
    image: grafana/loki:2.9.3
    container_name: jobmarket-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki

  promtail:
    image: grafana/promtail:2.9.3
    container_name: jobmarket-promtail
    depends_on:
      - loki
    volumes:
      - ./logs:/logs:ro  # Lecture seule des logs
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml

  grafana:
    image: grafana/grafana:10.2.3
    container_name: jobmarket-grafana
    depends_on:
      - loki
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP:-false}
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=${GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION:-false}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./monitoring/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./monitoring/dashboard-api-monitoring.json:/etc/grafana/provisioning/dashboards/dashboard-api-monitoring.json
      - ./monitoring/dashboard-realtime-ingestion.json:/etc/grafana/provisioning/dashboards/dashboard-realtime-ingestion.json
      - ./monitoring/dashboard-ft-ingestion.json:/etc/grafana/provisioning/dashboards/dashboard-ft-ingestion.json
      - ./monitoring/dashboard-wttj-ingestion.json:/etc/grafana/provisioning/dashboards/dashboard-wttj-ingestion.json

volumes:
  loki-data:
  grafana-data:
