version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: jobmarket-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - jobdb-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - ./data:/data

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -lc "
      mc alias set jobmarket http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb -p jobmarket/jobmarket || true &&
      echo '✅ Bucket ready: jobmarket'
      "
    restart: "no"

  jupyter:
    build: .
    image: jupyter/scipy-notebook:python-3.11
    container_name: jobmarket-jupyter
    depends_on:
      - minio-init
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: jobmarket
      PYTHONPATH: /home/jovyan/work    #  pour 
      

      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: jobmarket
      S3_PREFIX: ""   

      # optionnel : dataset courant
      # DATASET: france_travail

    volumes:
      # Code (repo entier)
      - ./:/home/jovyan/work

      # Mapping explicite notebooks pour éviter de devoir naviguer dans le filesystem du container pour les trouver
      - ./notebooks:/home/jovyan/notebooks

    working_dir: /home/jovyan/work
    command: >
      bash -lc "
      pip install -U pip &&
      if [ -f requirements.txt ]; then pip install -r requirements.txt; fi &&
      start-notebook.sh --NotebookApp.token=$${JUPYTER_TOKEN}
      "
  jobmarket-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: jobmarket-api
    depends_on:
      - minio-init
      - postgres
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override pour MinIO (accès interne Docker)
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      JOBSTORE_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs  # Logs accessibles sur l'hôte

  grafana:
    image: grafana/grafana:10.2.3
    container_name: jobmarket-grafana
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP:-false}
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=${GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION:-false}
      - GF_DATE_FORMATS_DEFAULT_TIMEZONE=browser
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jobmarket-pgadmin
    depends_on:
      - postgres
    ports:
      - "5050:80"
    env_file:
      - .env
    environment:
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "false"
      PGADMIN_CONFIG_COOKIE_DEFAULT_SECURE: "false"
      PGADMIN_CONFIG_COOKIE_SAMESITE: "'Lax'"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json

volumes:
  grafana-data:
  jobdb-data:
  pgadmin-data:
